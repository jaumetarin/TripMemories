spring.application.name=backend

# Entre 1 y 120; lotes de 40, como máximo 3 llamadas a Gemini por generación.
itinerarios.candidatos.max-evaluados=${ITINERARIOS_MAX_CANDIDATOS:120}

# UT17: controles de consumo por sesión; el resultado del plan sigue en memoria.
itinerarios.consumo.vigencia-minutos=${ITINERARIOS_VIGENCIA_MINUTOS:15}
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tripmemories}
spring.datasource.username=${DB_USER:tripmemories}
spring.datasource.password=${DB_PASSWORD:tripmemories_dev}

# Rute: nunca incluir estas credenciales en VITE ni en Git.
auth.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Rute}

# Configure the key in the backend terminal, never in frontend/VITE variables.
geoapify.api-key=${GEOAPIFY_API_KEY:}
gemini.api-key=${GEMINI_API_KEY:}
tavily.api-key=${TAVILY_API_KEY:}
ors.api-key=${ORS_API_KEY:}

# UT29-31: almacenamiento privado local, sustituible por otro proveedor.
fotos.directorio=${RUTE_FOTOS_DIRECTORIO:.rute-data/fotos}
fotos.max-archivo-bytes=${FOTOS_MAX_ARCHIVO_BYTES:10485760}
fotos.max-por-album=${FOTOS_MAX_POR_ALBUM:100}
fotos.max-pixeles=${FOTOS_MAX_PIXELES:40000000}
spring.servlet.multipart.max-file-size=${FOTOS_MAX_ARCHIVO_BYTES:10485760}B
spring.servlet.multipart.max-request-size=${FOTOS_MAX_SOLICITUD_BYTES:11534336}B
# Permite devolver un error comprensible sin cortar una subida ligeramente excesiva.
server.tomcat.max-swallow-size=${FOTOS_MAX_DESCARTE_BYTES:12582912}B

# Cambio de plan simulado; desactivar en despliegues sin demostracion.
planes.demo-habilitada=${PLANES_DEMO_HABILITADA:true}
