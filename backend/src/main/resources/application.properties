spring.application.name=backend

# Entre 1 y 120; lotes de 40, como máximo 3 llamadas a Gemini por generación.
itinerarios.candidatos.max-evaluados=${ITINERARIOS_MAX_CANDIDATOS:120}

# UT17: controles de sesión, sin cuentas ni almacenamiento permanente.
itinerarios.consumo.max-generaciones=${ITINERARIOS_MAX_GENERACIONES:3}
itinerarios.consumo.ventana-minutos=${ITINERARIOS_VENTANA_MINUTOS:60}
itinerarios.consumo.vigencia-minutos=${ITINERARIOS_VIGENCIA_MINUTOS:15}
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=jdbc:postgresql://localhost:5432/tripmemories
spring.datasource.username=tripmemories
spring.datasource.password=tripmemories_dev

# Configure the key in the backend terminal, never in frontend/VITE variables.
geoapify.api-key=${GEOAPIFY_API_KEY:}
gemini.api-key=${GEMINI_API_KEY:}
tavily.api-key=${TAVILY_API_KEY:}
ors.api-key=${ORS_API_KEY:}
