services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: tripmemories
      POSTGRES_USER: tripmemories
      POSTGRES_PASSWORD: tripmemories_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmemories -d tripmemories"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
