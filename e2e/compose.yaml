name: rute-avd

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rute_avd
      POSTGRES_USER: rute_avd
      POSTGRES_PASSWORD: rute_avd_local
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rute_avd -d rute_avd"]
      interval: 2s
      timeout: 5s
      retries: 30
